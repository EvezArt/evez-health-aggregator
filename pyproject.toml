[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evez-health-aggregator"
version = "0.1.0"
description = "EVEZ Health Aggregator — Full ecosystem scanner. 24 services, concurrent health checks, one endpoint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Steven Crawford-Maggard", email = "steven@evez-os.ai"}]
keywords = ["evez", "health", "monitoring", "aggregator"]
dependencies = [
    "fastapi>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
